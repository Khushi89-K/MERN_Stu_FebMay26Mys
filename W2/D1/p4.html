<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning elements: Fixed</title>
    <style>
        body{
            background-color: greenyellow;
        }
        .content{
            position: fixed;
            top: 10px;
            right: 30px;
            border:1px solid black;
            height: 100px;
            width: 150px;
            padding: 10px;
            color: blue;
            background-color: aquamarine;
            border-radius: 10px;
            box-shadow: 5px 4px black;

            
        }
       
     
    </style>
</head>
<body>
    <h2>Fixed position</h2>
    <div class="fixed-box">
        <p style="height: 100px">Lorem Ipsum is simply dummy text of the printing and typesetting industry</p>
        <div class="content">Fixed box</div>
        <p style="height: 100px">Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen</p>
        
    </div>
</body>
</html>
